services:
  9router:
    image: decolua/9router:latest
    restart: unless-stopped
    environment:
      PORT: "20128"
      BASE_URL: "{{url}}"
      DATA_DIR: /app/data
      INITIAL_PASSWORD: "{{password}}"
      JWT_SECRET: "{{secret}}"
      API_KEY_SECRET: "{{secret2}}"
      REQUIRE_API_KEY: "true"
      ENABLE_REQUEST_LOGS: "false"
      TZ: "{{tz}}"
    volumes:
      - data:/app/data
volumes:
  data: {}
