x-mautic: &mautic
  image: mautic/mautic:6-apache
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - config:/var/www/html/config
    - logs:/var/www/html/var/logs
    - files:/var/www/html/docroot/media/files
    - images:/var/www/html/docroot/media/images
    - cron:/opt/mautic/cron
x-mautic-env: &env
  MAUTIC_DB_HOST: db
  MAUTIC_DB_PORT: "3306"
  MAUTIC_DB_NAME: mautic
  MAUTIC_DB_USER: mautic
  MAUTIC_DB_PASSWORD: "{{password}}"
  MAUTIC_TRUSTED_PROXIES: '["0.0.0.0/0"]'
  PHP_INI_VALUE_DATE_TIMEZONE: "{{tz}}"
  DOCKER_MAUTIC_WORKERS_CONSUME_EMAIL: "2"
  DOCKER_MAUTIC_WORKERS_CONSUME_HIT: "2"
  DOCKER_MAUTIC_WORKERS_CONSUME_FAILED: "1"
services:
  mautic_web:
    <<: *mautic
    environment:
      <<: *env
      DOCKER_MAUTIC_ROLE: mautic_web
  mautic_cron:
    <<: *mautic
    depends_on: [mautic_web]
    environment:
      <<: *env
      DOCKER_MAUTIC_ROLE: mautic_cron
  mautic_worker:
    <<: *mautic
    depends_on: [mautic_web]
    environment:
      <<: *env
      DOCKER_MAUTIC_ROLE: mautic_worker
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mautic
      MYSQL_USER: mautic
      MYSQL_PASSWORD: "{{password}}"
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -umautic -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  config: {}
  logs: {}
  files: {}
  images: {}
  cron: {}
  db: {}
