services:
  anki:
    image: python:3.12-slim
    restart: unless-stopped
    environment:
      ANKI_SPEC: "anki>=26.9,<27"
      SYNC_USER1: "admin:{{password}}"
      SYNC_BASE: /data/sync
      SYNC_HOST: 0.0.0.0
      SYNC_PORT: "8080"
      MAX_SYNC_PAYLOAD_MEGS: "500"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        [ -x /data/venv/bin/python ] || python -m venv /data/venv
        if [ "$$(cat /data/venv/.spec 2>/dev/null)" != "$$ANKI_SPEC" ]; then
          /data/venv/bin/pip install --no-cache-dir -q "$$ANKI_SPEC"
          echo "$$ANKI_SPEC" > /data/venv/.spec
        fi
        mkdir -p "$$SYNC_BASE"
        exec /data/venv/bin/python -m anki.syncserver
    volumes:
      - data:/data
volumes:
  data: {}
