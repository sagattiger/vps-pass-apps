services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:latest
    restart: unless-stopped
    environment:
      APP_URL: "{{url}}"
      ENCRYPTION_KEY: "{{secret}}"
      TRUST_PROXY: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
      PUID: "1000"
      PGID: "1000"
      TZ: "{{tz}}"
    volumes:
      - data:/app/data
volumes:
  data: {}
