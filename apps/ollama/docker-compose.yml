services:
  proxy:
    image: nginx:1-alpine
    restart: unless-stopped
    depends_on: [ollama]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 8080;
          client_max_body_size 50m;
          location / {
            if ($$http_authorization != "Bearer {{secret}}") { return 401; }
            proxy_pass http://ollama:11434;
            proxy_set_header Host localhost:11434;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 600s;
          }
        }
        EOF
        exec nginx -g 'daemon off;'
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /bin/ollama serve &
        PID=$$!
        trap 'kill $$PID' TERM INT
        for i in $$(seq 1 30); do [ -f /root/.ollama/id_ed25519.pub ] && break; sleep 1; done
        echo "=== Ollama public key: add it at https://ollama.com/settings/keys ==="
        cat /root/.ollama/id_ed25519.pub
        wait $$PID
    volumes:
      - data:/root/.ollama
volumes:
  data: {}
