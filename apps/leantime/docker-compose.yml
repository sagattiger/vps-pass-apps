services:
  leantime:
    image: leantime/leantime:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      LEAN_APP_URL: "{{url}}"
      LEAN_SITENAME: Leantime
      LEAN_DB_HOST: db
      LEAN_DB_USER: leantime
      LEAN_DB_PASSWORD: "{{password}}"
      LEAN_DB_DATABASE: leantime
      LEAN_SESSION_PASSWORD: "{{secret}}"
      LEAN_SESSION_SECURE: "true"
      LEAN_DEFAULT_TIMEZONE: "{{tz}}"
    volumes:
      - public_userfiles:/var/www/html/public/userfiles
      - userfiles:/var/www/html/userfiles
      - plugins:/var/www/html/app/Plugins
      - logs:/var/www/html/storage/logs
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: leantime
      MARIADB_USER: leantime
      MARIADB_PASSWORD: "{{password}}"
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  public_userfiles: {}
  userfiles: {}
  plugins: {}
  logs: {}
  db: {}
