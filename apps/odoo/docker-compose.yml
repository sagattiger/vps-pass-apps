services:
  odoo:
    image: odoo:20.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["odoo", "--proxy-mode", "--no-database-list", "-d", "odoo", "--db-filter", "^odoo$$"]
    environment:
      HOST: db
      USER: odoo
      PASSWORD: "{{password}}"
      TZ: "{{tz}}"
    volumes:
      - data:/var/lib/odoo
      - addons:/mnt/extra-addons
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: "{{password}}"
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  data: {}
  addons: {}
  pg: {}
