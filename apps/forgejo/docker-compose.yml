services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__DOMAIN: "{{host}}"
      FORGEJO__server__ROOT_URL: "{{url}}/"
      FORGEJO__server__DISABLE_SSH: "true"
    volumes:
      - data:/data
volumes:
  data: {}
