services:
  web:
    image: nginx:1-alpine
    restart: unless-stopped
    depends_on: [server, client]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        map $$http_upgrade $$connection_upgrade { default upgrade; '' close; }
        server {
          listen 8080;
          client_max_body_size 500m;
          location /api/ {
            proxy_pass http://server:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $$http_upgrade;
            proxy_set_header Connection $$connection_upgrade;
            proxy_set_header Host $$host;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
            proxy_buffering off;
          }
          location / {
            proxy_pass http://client:80;
            proxy_set_header Host $$host;
          }
        }
        EOF
        exec nginx -g 'daemon off;'
  client:
    image: ghcr.io/colanode/web:latest
    restart: unless-stopped
  server:
    image: ghcr.io/colanode/server:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    environment:
      POSTGRES_URL: "postgres://colanode:{{password}}@postgres:5432/colanode"
      REDIS_URL: "redis://valkey:6379/0"
      SERVER_PATH_PREFIX: api
    volumes:
      - storage:/var/lib/colanode/storage
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: colanode
      POSTGRES_PASSWORD: "{{password}}"
      POSTGRES_DB: colanode
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colanode -d colanode"]
      interval: 10s
      timeout: 5s
      retries: 10
  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey:/data
volumes:
  storage: {}
  db: {}
  valkey: {}
