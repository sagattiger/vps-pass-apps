services:
  plausible:
    image: ghcr.io/plausible/community-edition:v3.2.1
    restart: unless-stopped
    command: ["sh", "-c", "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"]
    depends_on:
      plausible_db:
        condition: service_healthy
      plausible_events_db:
        condition: service_started
    env_file:
      - path: app.env
        required: false
    environment:
      BASE_URL: "{{url}}"
      SECRET_KEY_BASE: "{{hex64}}"
      HTTP_PORT: "8000"
      DATABASE_URL: "postgres://postgres:{{password}}@plausible_db:5432/plausible_db"
      CLICKHOUSE_DATABASE_URL: "http://plausible_events_db:8123/plausible_events_db"
      DISABLE_REGISTRATION: "false"
    volumes:
      - data:/var/lib/plausible
  plausible_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "{{password}}"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
  plausible_events_db:
    image: clickhouse/clickhouse-server:24.12-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/clickhouse-server/config.d /etc/clickhouse-server/users.d
        cat > /etc/clickhouse-server/config.d/logs.xml <<'EOF'
        <clickhouse>
          <logger><level>warning</level><console>true</console></logger>
          <metric_log remove="remove"/>
          <asynchronous_metric_log remove="remove"/>
          <query_thread_log remove="remove"/>
          <text_log remove="remove"/>
          <trace_log remove="remove"/>
          <session_log remove="remove"/>
          <part_log remove="remove"/>
        </clickhouse>
        EOF
        cat > /etc/clickhouse-server/config.d/ipv4-only.xml <<'EOF'
        <clickhouse><listen_host>0.0.0.0</listen_host></clickhouse>
        EOF
        cat > /etc/clickhouse-server/config.d/low-resources.xml <<'EOF'
        <clickhouse><mark_cache_size>524288000</mark_cache_size></clickhouse>
        EOF
        cat > /etc/clickhouse-server/users.d/default-profile-low-resources-overrides.xml <<'EOF'
        <clickhouse><profiles><default>
          <max_threads>1</max_threads>
          <max_block_size>8192</max_block_size>
          <max_download_threads>1</max_download_threads>
          <input_format_parallel_parsing>0</input_format_parallel_parsing>
          <output_format_parallel_formatting>0</output_format_parallel_formatting>
        </default></profiles></clickhouse>
        EOF
        exec /entrypoint.sh
    volumes:
      - events:/var/lib/clickhouse
      - events-logs:/var/log/clickhouse-server
volumes:
  data: {}
  db: {}
  events: {}
  events-logs: {}
