x-affine-env: &env
  REDIS_SERVER_HOST: redis
  DATABASE_URL: "postgresql://affine:{{password}}@postgres:5432/affine"
  AFFINE_INDEXER_ENABLED: "false"
  AFFINE_SERVER_EXTERNAL_URL: "{{url}}"
  AFFINE_SERVER_HTTPS: "true"
  AFFINE_SERVER_HOST: "{{host}}"
services:
  affine:
    image: ghcr.io/toeverything/affine:stable
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *env
    volumes:
      - storage:/root/.affine/storage
      - config:/root/.affine/config
  migration:
    image: ghcr.io/toeverything/affine:stable
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["node ./scripts/self-host-predeploy.js && exec sleep infinity"]
    environment: *env
    volumes:
      - storage:/root/.affine/storage
      - config:/root/.affine/config
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis:/data
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: affine
      POSTGRES_PASSWORD: "{{password}}"
      POSTGRES_DB: affine
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affine -d affine"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  storage: {}
  config: {}
  redis: {}
  db: {}
