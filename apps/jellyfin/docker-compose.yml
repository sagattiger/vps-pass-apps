services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.6
    restart: unless-stopped
    environment:
      JELLYFIN_PublishedServerUrl: "{{url}}"
      TZ: "{{tz}}"
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - jellyfin_media:/media
volumes:
  jellyfin_config: {}
  jellyfin_cache: {}
  jellyfin_media: {}
